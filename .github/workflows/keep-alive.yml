# Two jobs against the deployed Render backend:
#   1. keep-alive — pings /ping every 14 min (just under Render's
#      15-minute spin-down window) so the free-tier service stays warm.
#   2. trigger-scan — calls /internal/kb/scan every ~28 min. This is NOT
#      redundant with Render's own in-process scheduler: Render's free
#      tier kills any in-process background thread (APScheduler
#      included) the same way it idles HTTP traffic, so KB_SCAN_ENABLED's
#      in-process scheduler silently stops running whenever the process
#      has been idle. Triggering the scan externally doesn't depend on
#      the web process having stayed alive continuously — this is the
#      free-tier-compatible alternative to Render's own Cron Job service
#      type, which costs $5/mo and isn't part of the free tier.
#
# NOTE: this used to pick out "every other run" via
#   github.run_number % 2 == 0
# GitHub Actions' expression language has no arithmetic operators at all
# (only ==, !=, !, &&, ||, <, <=, >, >=) — `%` is not valid there, so that
# condition failed workflow validation outright ("Invalid workflow file"),
# meaning trigger-scan never ran on schedule. Fixed below by giving the
# workflow two separate `schedule` entries instead: GitHub sets
# github.event.schedule to whichever cron string actually fired a given
# run, so each job just checks which one it is — no modulo needed.
#
# Setup — two repository variables/secrets needed (Settings > Secrets and
# variables > Actions):
#   - Variable BACKEND_URL: your Render URL, e.g. https://your-service.onrender.com (no trailing slash)
#   - Secret KB_SCAN_SECRET: same value as KB_SCAN_CRON_SECRET in Render's env vars
#     (use a Secret, not a Variable, for this one — it's a credential)
name: Keep Render backend alive and trigger KB scans

on:
  schedule:
    - cron: "*/14 * * * *"   # keep-alive cadence
    - cron: "*/28 * * * *"   # scan cadence (~ every other keep-alive tick, close to KB_SCAN_INTERVAL_MINUTES=30)
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/14 * * * *'
    steps:
      - name: Ping backend /ping route
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repository variable is not set — see workflow file comments."
            exit 1
          fi
          curl -fsS "${{ vars.BACKEND_URL }}/ping" || echo "Ping failed — service may have been mid-cold-start; next scheduled ping will retry."

  trigger-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/28 * * * *'
    steps:
      - name: Trigger KB scan
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repository variable is not set — see workflow file comments."
            exit 1
          fi
          if [ -z "${{ secrets.KB_SCAN_SECRET }}" ]; then
            echo "KB_SCAN_SECRET repository secret is not set — see workflow file comments."
            exit 1
          fi
          curl -fsS -X POST "${{ vars.BACKEND_URL }}/internal/kb/scan" \
            -H "X-Scan-Secret: ${{ secrets.KB_SCAN_SECRET }}" \
            || echo "Scan trigger failed — check Render logs for /internal/kb/scan around this time."
